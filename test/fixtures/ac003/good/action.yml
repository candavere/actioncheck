name: ac003-good
description: inputs are case-insensitive and bracket access works
inputs:
  Token:
    description: used with different case
  dash-name:
    description: bracket access
  old-flag:
    description: kept for compatibility
    deprecationMessage: no longer used
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        DASH: ${{ inputs['dash-name'] }}
      run: echo "$TOKEN $DASH"
