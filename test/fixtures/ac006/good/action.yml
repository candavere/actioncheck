name: ac006-good
description: valid expressions only
inputs:
  name:
    description: n
runs:
  using: composite
  steps:
    - shell: bash
      if: ${{ !cancelled() && (runner.os == 'Linux' || startsWith(github.ref, 'refs/tags/')) }}
      run: |
        echo "${{ format('{0}-{1}', inputs.name, github.run_id) }}"
        echo "${{ toJSON(github.event.pull_request.labels.*.name) }}"
        echo "${{ hashFiles('**/package-lock.json') }} ${{ env.HOME }} ${{ job.status }}"
        echo "it''s ${{ 'quoted }} text' }} ok ${{ 0x10 > -1.5e2 }}"
