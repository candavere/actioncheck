name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack and install the tarball into a fresh folder, then run the README commands
        shell: bash
        run: |
          npm pack
          TGZ="$PWD/$(ls actioncheck-*.tgz)"
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE" && cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TGZ"
          bash "$GITHUB_WORKSPACE/scripts/readme-smoke.sh"
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Lint the corpus of real composite actions (must have 0 errors)
        run: node dist/src/cli.js corpus/actions --format github
